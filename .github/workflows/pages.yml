name: Publicar site da disciplina

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rg-interactive-lab/package-lock.json

      - name: Construir RG Interactive Lab
        working-directory: rg-interactive-lab
        run: |
          npm ci
          npm run build

      - name: Montar site estático
        run: |
          mkdir _site
          cp index.html styles.css favicon.svg .nojekyll _site/
          # `imagens` estava faltando: a pagina referenciava o logotipo do
          # ODEROM e ele saiu 404 no site, embora funcionasse ao servir o
          # repositorio localmente -- porque local o diretorio esta la', e
          # aqui a copia e' por lista explicita.
          cp -r apostila notebooks dashboards codigos imagens _site/
          (cd apostila/fonte && zip -qr "$GITHUB_WORKSPACE/_site/codigos/codigos-relatividade-geral.zip" codigo)
          mkdir -p _site/dashboards/capitulo-4
          cp -r rg-interactive-lab/dist/. _site/dashboards/capitulo-4/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
